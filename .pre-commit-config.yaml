repos:
  # ── Secrets scanning ──────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: >
          (?x)^(
            node_modules/|\.git/|dist/|build/|
            .*\.lock$|.*\.min\.js$
          )

  # ── Local SeaBridgeAI harness hooks ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: seabridge-openseabri-harness
        name: SeaBridgeAI OpenSeaBri harness guardrails
        entry: powershell -ExecutionPolicy Bypass -File C:/Users/adelm/SeaBridgeAI/everything-claude-code/scripts/check-frontend-guardrails.ps1 -RepoPath C:/Users/adelm/SeaBridgeAI/openseabri -Scope all -FailOnFinding -BlockingRules frontend.production-console
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
      - id: seabridge-agent-runtime-harness
        name: SeaBridgeAI agent runtime guardrails
        entry: powershell -ExecutionPolicy Bypass -File C:/Users/adelm/SeaBridgeAI/everything-claude-code/scripts/check-agent-runtime-guardrails.ps1
        language: system
        pass_filenames: false
      - id: npm-audit-on-push
        name: Node.js CVE scan (npm audit)
        entry: npm audit --audit-level=high
        language: system
        pass_filenames: false
        stages: [pre-push]
