name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Node tests
        run: npm run test:node

      - name: Provider readiness and mocked channel smoke
        run: npm test -- --run gateway/seabri/provider-readiness.test.ts gateway/telemetry/store.test.ts gateway/channels/mocked-live-channel-smoke.test.ts gateway/seabri/outbound.test.ts

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Capture bundle sizes
        shell: bash
        run: |
          find dist/assets -maxdepth 1 -type f -printf "%f %s bytes\n" | sort > bundle-sizes.txt
          cat bundle-sizes.txt

      - name: Upload bundle sizes
        uses: actions/upload-artifact@v4
        with:
          name: bundle-sizes-${{ matrix.os }}-node-${{ matrix.node }}
          path: bundle-sizes.txt

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs present
        run: |
          test -f README.md
          test -f LICENSE
          test -f REFERENCE.md
          test -f SOUL.md
          test -f AGENTS.md
          test -f TOOLS.md
          echo "All required docs present."
