# OpenSeaBri — Fly.io deployment config
#
# Secrets must be set via CLI (never store real values here):
#   fly secrets set OPENSEABRI_API_KEY=<value>
#   fly secrets set SEABRI_WS_TOKEN=<value>
#   fly secrets set OPENSEABRI_CANVAS_WS_TOKEN=<value>
#   fly secrets set OPENSEABRI_CORS_ORIGIN=https://app.<your-domain>
#   fly secrets set SEABRI_DATABASE_URL=<postgres-connection-string>
#   fly secrets set <LLM_PROVIDER_KEY>=<value>  (see docs/deployment/OPENSEABRI_OWNER_MANUAL_ACTIONS.md)
#
# Deploy: fly launch --config fly.toml

app = "openseabri"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 18790
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[env]
  NODE_ENV = "production"
  OPENSEABRI_MODE = "production"
  GATEWAY_PORT = "18790"
  OPENSEABRI_PERSISTENCE_ADAPTER = "database"
  OPENSEABRI_TELEMETRY_STORE = "database"
  OPENSEABRI_RATE_LIMIT = "120"
  OPENSEABRI_CHANNELS_ENABLED = ""
  OPENSEABRI_LIVE_PROVIDER_APPROVED = "false"
  OPENSEABRI_LIVE_PROVIDER_TESTS_ENABLED = "false"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
